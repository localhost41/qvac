name: localhost41 SDK 0.19 runtime evidence
on:
  push:
    branches: [feature-sdk019-runtime-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-evidence:
    if: github.repository == 'localhost41/qvac'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: localhost41/qvac
          ref: 5ae0616cdae0c17fc7ac7a007a85e8b78269c13e
          path: pr-source
          sparse-checkout: |
            packages/sdk
            packages/inference/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Start pristine published-SDK consumer
        run: |
          mkdir -p .evidence/consumer .evidence/artifacts
          docker pull node:22-slim
          docker image inspect node:22-slim > .evidence/artifacts/container-image.json
          docker run -d --name qvac-response-evidence -v "$GITHUB_WORKSPACE:/work" -w /work/.evidence/consumer node:22-slim sleep infinity
          docker exec qvac-response-evidence sh -c 'cat /etc/os-release > ../artifacts/os-release.txt; node --version > ../artifacts/node-version.txt; ldconfig -p > ../artifacts/baseline-ldconfig.txt; dpkg-query -W > ../artifacts/baseline-packages.txt'
          docker exec qvac-response-evidence sh -c 'npm init -y && npm install --omit=peer --no-audit --no-fund @qvac/sdk@0.19.0'
          docker exec qvac-response-evidence sh -c 'npm ls --all --json > ../artifacts/sdk-dependency-tree.json || true; cp package-lock.json ../artifacts/sdk-package-lock.json'
      - name: Record the SDK installed-tree dependencies against the pristine image
        run: |
          python3 scripts/ci/localhost41-needed-evidence.py .evidence/consumer/node_modules .evidence/artifacts
      - name: Build the exact PR SDK and install the published CLI
        run: |
          docker exec -w /work/pr-source/packages/sdk qvac-response-evidence sh -c 'npm install --omit=peer --no-audit --no-fund && npx --no-install tsc --project tsconfig.json && npm run postcompile:aliases && npm pack --ignore-scripts --pack-destination /work/.evidence/artifacts' > .evidence/artifacts/sdk-build.log 2>&1
          docker exec qvac-response-evidence sh -c 'npm install --omit=peer --no-audit --no-fund @qvac/cli@0.13.0 && cp package-lock.json ../artifacts/cli-package-lock.json'
      - name: Reproduce HTTP response with the published SDK
        run: |
          docker exec qvac-response-evidence node /work/scripts/ci/localhost41-http-evidence.mjs released
      - name: Reproduce HTTP response with the complete built PR package
        run: |
          docker exec qvac-response-evidence sh -c 'npm install --omit=peer --no-audit --no-fund ../artifacts/qvac-sdk-*.tgz && cp package-lock.json ../artifacts/branch-package-lock.json'
          docker exec qvac-response-evidence node /work/scripts/ci/localhost41-http-evidence.mjs branch
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: sdk019-http-and-native-inventory
          include-hidden-files: true
          path: |
            .evidence/artifacts/
            !.evidence/artifacts/*.tgz
          retention-days: 30
      - name: Stop the disposable container
        if: always()
        run: docker rm -f qvac-response-evidence
