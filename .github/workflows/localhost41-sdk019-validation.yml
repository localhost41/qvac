name: localhost41 SDK 0.19 runtime evidence
on:
  push:
    branches: [feature-sdk019-runtime-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opencode-published:
    if: github.repository == 'localhost41/qvac'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SMOKE_DIR: ${{ github.workspace }}/.probe/project
      ARTIFACT_DIR: ${{ github.workspace }}/.probe/artifacts
      QVAC_HOST_LOG: ${{ github.workspace }}/.probe/artifacts/qvac-host.log
      XDG_CONFIG_HOME: ${{ github.workspace }}/.probe/config
      XDG_DATA_HOME: ${{ github.workspace }}/.probe/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.probe/cache
      XDG_STATE_HOME: ${{ github.workspace }}/.probe/state
      QVAC_DEBUG: '1'
      QVAC_MODEL: qwen3.5-0.8b
      QVAC_READY_TIMEOUT_MS: '1800000'
      QVAC_UPSTREAM_TIMEOUT_MS: '300000'
      OPENCODE_TIMEOUT: 30m
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: localhost41/qvac
          ref: 5877dc5318d5ac9a0625b1606189512d1da76e5e
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
      - name: Run the exact PR 4333 smoke script with published packages
        run: bash scripts/ci/opencode-upstream-compat-smoke.sh
      - name: Confirm the tested release versions and preserve the lockfile
        run: |
          cp "$SMOKE_DIR/package-lock.json" "$ARTIFACT_DIR/package-lock.json"
          node - <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.env.ARTIFACT_DIR
          const versions = JSON.parse(fs.readFileSync(path.join(root, 'package-versions.json')))
          assert.equal(versions['@qvac/opencode-plugin'], '0.3.1')
          assert.equal(versions['@qvac/sdk'], '0.19.0')
          assert.equal(versions['@qvac/cli'], '0.13.0')
          fs.writeFileSync(path.join(root, 'provenance.json'), JSON.stringify({ sourceCommit: '5877dc5318d5ac9a0625b1606189512d1da76e5e', note: 'Exact PR smoke script and verifier; packages installed unmodified from npm; default plugin-name loading.' }, null, 2))
          NODE
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: opencode-sdk019-published
          include-hidden-files: true
          path: .probe/artifacts/
          retention-days: 30
